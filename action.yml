name: 'Glean Agent Sync'
description: 'Glean Agent Sync is responsible for syncing your git-managed Glean agents into your Glean environment. This action does the following: 1. Create draft preview links on PRs 2. Sync updated agent definitions into Glean on merge'
branding:
  icon: 'git-merge'
  color: 'blue'
inputs:
  instance-url-fe:
    description: 'Frontend instance URL for preview links (e.g. https://canary.glean.com)'
    required: true
  instance-url-be:
    description: 'Backend instance URL for API calls (e.g. https://acme-be.glean.com)'
    required: true
  agent-directory:
    description: 'Path within the repo where agent spec folders live'
    required: false
    default: '.glean/agents'
  shared-root:
    description: 'Root directory containing shared reusable agent resources (skills, sub-agents, prompts). Agents may depend on files here via symlinks.'
    required: false
    default: '.glean/common'
  api-token:
    description: 'Glean client API token with AGENTS scope'
    required: true
  default-sync-mode:
    description: 'Default sync mode for agents on push to master: "staged" (default) or "published". Can be overridden per-agent via the sync-mode field in glean-sync.yaml.'
    required: false
    default: 'staged'
  pr-head-ref:
    description: 'PR head branch ref for retry link generation on workflow_dispatch (usually resolved from pr_number in the caller workflow).'
    required: false
    default: ''
outputs:
  synced-agents:
    description: 'JSON array of synced agent summaries [{agentId, mode, status}]'
    value: ${{ steps.sync.outputs.synced-agents }}

runs:
  using: 'composite'
  steps:
    - name: Detect changed agent folders
      id: detect
      shell: bash
      env:
        AGENT_DIR: ${{ inputs.agent-directory }}
        SHARED_ROOT: ${{ inputs.shared-root }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        SPECIFIC_AGENT_FOLDER: ${{ github.event.inputs.agent_folder }}
      run: ${{ github.action_path }}/scripts/detect-changes.sh

    - name: Install uv (for auto-mode agent converter)
      if: steps.detect.outputs.folders != '[]'
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Install yq
      if: steps.detect.outputs.folders != '[]'
      shell: bash
      env:
        YQ_VERSION: "v4.44.6"
        YQ_SHA256: "0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598"
      run: |
        wget -qO /usr/local/bin/yq \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c
        chmod +x /usr/local/bin/yq

    - name: Validate inputs
      shell: bash
      env:
        DEFAULT_SYNC_MODE: ${{ inputs.default-sync-mode }}
      run: |
        if [ "$DEFAULT_SYNC_MODE" != "staged" ] && [ "$DEFAULT_SYNC_MODE" != "published" ]; then
          echo "::error::Invalid default-sync-mode input '${DEFAULT_SYNC_MODE}' — must be 'staged' or 'published'. Update the default-sync-mode value in your workflow YAML that calls this action."
          exit 1
        fi

    - name: Resolve PR author
      id: pr-author
      if: steps.detect.outputs.folders != '[]'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        ACTOR: ${{ github.actor }}
      run: |
        if [ -n "$PR_USER_LOGIN" ]; then
          echo "author=$PR_USER_LOGIN" >> "$GITHUB_OUTPUT"
        else
          AUTHOR=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" --jq '.[0].user.login // ""' 2>/dev/null || echo "")
          echo "author=${AUTHOR:-$ACTOR}" >> "$GITHUB_OUTPUT"
        fi

    - name: Parse and sync each agent
      id: sync
      if: steps.detect.outputs.folders != '[]'
      shell: bash
      env:
        API_TOKEN: ${{ inputs.api-token }}
        AGENT_DIR: ${{ inputs.agent-directory }}
        EVENT_NAME: ${{ steps.detect.outputs.event }}
        COMMIT_SHA: ${{ steps.detect.outputs.commit_sha }}
        DEFAULT_MESSAGE: ${{ steps.detect.outputs.default_message }}
        DEFAULT_SYNC_MODE: ${{ inputs.default-sync-mode }}
        INSTANCE_URL_BE: ${{ inputs.instance-url-be }}
        FOLDERS_JSON: ${{ steps.detect.outputs.folders }}
        FORCE_DRAFT: ${{ github.event.inputs.is_draft }}
        PR_RETRY: ${{ github.event.inputs.pr_number }}
        PR_AUTHOR: ${{ steps.pr-author.outputs.author }}
      run: ${{ github.action_path }}/scripts/sync-agents.sh

    - name: Comment PR with preview links
      # `always()` keeps this running even when sync fails (we still want the PR
      # comment to surface the failure), but only if `detect` itself succeeded
      # AND produced a non-empty folder list — otherwise there is nothing to
      # comment on and we'd just be reading a missing results file.
      if: |
        always()
        && (
          github.event_name == 'pull_request'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')
        )
        && steps.detect.outcome == 'success'
        && steps.detect.outputs.folders != ''
        && steps.detect.outputs.folders != '[]'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INSTANCE_URL_FE: ${{ inputs.instance-url-fe }}
        INSTANCE_URL_BE: ${{ inputs.instance-url-be }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        REPO: ${{ github.repository }}
        SYNC_WORKFLOW_FILE: glean-agent-sync.yml
      run: ${{ github.action_path }}/scripts/comment-pr.sh

    - name: Comment merged PR with run links
      if: |
        always()
        && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && steps.detect.outcome == 'success'
        && steps.detect.outputs.folders != ''
        && steps.detect.outputs.folders != '[]'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INSTANCE_URL_FE: ${{ inputs.instance-url-fe }}
        COMMIT_SHA: ${{ steps.detect.outputs.commit_sha }}
        REPO: ${{ github.repository }}
      run: ${{ github.action_path }}/scripts/comment-merge.sh
